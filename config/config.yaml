# ==============================================================================
# 本地一体化 AI Agent 可观测性平台配置文件 (config.yaml)
# ==============================================================================
# 提取规则说明：
# 1. 系统启动时首先尝试读取系统本地环境变量（如 PHOENIX_PORT, PHOENIX_HOST 等）；
# 2. 若环境变量不存在或为空，则自动回退并加载本配置文件中的默认值；
# 3. 本配置支持不同运行环境（开发/生产）的本地覆盖与快速切换。
# ==============================================================================

server:
  host: "127.0.0.1"             # 服务监听主机绑定地址 (环境变量: PHOENIX_HOST)
  port: 6006                    # HTTP / Web UI 访问端口 (环境变量: PHOENIX_PORT)
  host_root_path: ""            # 反向代理根路径子目录，必须以 / 开头且不以 / 结尾 (环境变量: PHOENIX_HOST_ROOT_PATH)
  root_url: ""                  # 完整的外部访问根 URL (环境变量: PHOENIX_ROOT_URL)
  allowed_origins:              # 允许跨域访问 CORS 的域名列表 (环境变量: PHOENIX_ALLOWED_ORIGINS，以逗号分隔)
    - "*"
  tls_enabled: false            # 是否启用 HTTPS / TLS (环境变量: PHOENIX_TLS_ENABLED)

database:
  connection_str: ""            # 数据库连接串 (环境变量: PHOENIX_SQL_DATABASE_URL)。为空时默认使用 sqlite:///{working_dir}/phoenix.db
  read_replica_url: ""          # 只读副本数据库连接串 (环境变量: PHOENIX_SQL_DATABASE_READ_REPLICA_URL)
  working_dir: "~/.phoenix"     # 本地持久化工作目录 (环境变量: PHOENIX_WORKING_DIR)
  log_sql: false                # 是否打印 SQLAlchemy 执行的底层 SQL 语句 (环境变量: PHOENIX_LOG_SQL)
  allocated_storage_gibibytes: 10   # 数据库分配的最大存储容量 (GiB) (环境变量: PHOENIX_DATABASE_ALLOCATED_STORAGE_CAPACITY_GIBIBYTES)
  usage_email_warning_threshold: 80 # 空间使用告警阈值百分比
  usage_insertion_blocking_threshold: 95 # 空间使用阻止写入阈值百分比

security:
  secret: ""                    # JWT 签名与加盐主密钥 (环境变量: PHOENIX_SECRET)
  admin_secret: ""              # 管理员特权密钥 (环境变量: PHOENIX_ADMIN_SECRET)

queue:
  max_spans_queue_size: 10000   # 内存中 Span 接收缓冲队列的最大容量 (环境变量: PHOENIX_MAX_SPANS_QUEUE_SIZE)

