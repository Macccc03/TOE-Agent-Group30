<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Phoenix · Tracing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="/modernizr.js"></script>
    <style>
      /* Paint the product surface before the React bundle resolves the theme,
         so a refresh does not flash a white page in dark mode. */
      html {
        background: #0e0e0e;
        color-scheme: dark;
      }
      html:has(body.theme--light) {
        background: #ffffff;
        color-scheme: light;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/phoenix-runtime-config.js"></script>
    <script type="module" src="/bootstrap.ts"></script>
  </body>
</html>
